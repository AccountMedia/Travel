<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e8a94">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cebu Escape 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --sea:#0e8a94; --sea-deep:#0b5563; --lagoon:#6fd3d0; --foam:#e3f7f5;
  --sand:#fbf3e4; --sand-2:#f3e3c3; --coral:#ff7a59; --coral-soft:#ffe3d9;
  --sun:#ffc24b; --palm:#2f8f5b; --palm-soft:#dff1e5;
  --ink:#15333b; --muted:#5d7a80; --card:#fffdf8; --line:#ecdcbc;
  --shadow:0 6px 22px rgba(14,90,100,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:var(--sand);color:var(--ink);
  -webkit-tap-highlight-color:transparent;padding-bottom:calc(96px + env(safe-area-inset-bottom));min-height:100vh}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0;line-height:1.15}
h2{font-size:22px} h3{font-size:17px}
a{color:var(--sea)}
button{cursor:pointer;font:inherit}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(180deg,#ffd9a0 0%,#ffb27d 20%,#63cdc9 58%,#0e8a94 100%);
  padding:calc(18px + env(safe-area-inset-top)) 0 70px}
.hero .sun{position:absolute;width:150px;height:150px;border-radius:50%;top:-30px;right:8%;
  background:radial-gradient(circle,#fff6d2 0%,#ffd36b 45%,rgba(255,194,75,0) 70%)}
.hero .palm{position:absolute;left:-18px;bottom:26px;width:150px;opacity:.9}
.hero .palm2{position:absolute;right:-30px;bottom:18px;width:120px;opacity:.55;transform:scaleX(-1)}
.hero .wrap{position:relative;z-index:2}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(11,85,99,.35);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.35);padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--sun)}
.pill.ok .dot{background:#7cf0a5}
.hero h1{font-size:clamp(34px,8vw,58px);font-weight:800;margin:18px 0 4px;text-shadow:0 2px 14px rgba(0,60,70,.25);letter-spacing:-.5px}
.hero .sub{font-size:15px;opacity:.95;text-shadow:0 1px 6px rgba(0,60,70,.3)}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:60px;z-index:1}

.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
main{position:relative;margin-top:-34px;z-index:3}

/* ---------- basics ---------- */
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stack>*+*{margin-top:14px}
.grid{display:grid;gap:14px}
@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}.places{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1040px){.places{grid-template-columns:repeat(3,1fr)}}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.mt{margin-top:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.kicker{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.big{font-family:'Fraunces',serif;font-size:40px;font-weight:800;line-height:1}
.sec-title{display:flex;justify-content:space-between;align-items:end;margin:22px 2px 10px}
.sec-title h2{color:var(--sea-deep)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}

.btn{background:var(--sea);color:#fff;border:0;border-radius:14px;padding:11px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.coral{background:var(--coral)}
.btn.sun{background:var(--sun);color:var(--sea-deep)}
.btn.ghost{background:transparent;color:var(--sea);border:1.5px solid var(--sea)}
.btn.danger{color:#c43d2b;border-color:#e7a79c}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.linkbtn{background:none;border:0;color:var(--sea);font-weight:700;font-size:14px;padding:4px}
.icon-btn{background:#fff;border:1px solid var(--line);border-radius:12px;width:38px;height:38px;display:inline-grid;place-items:center;font-size:16px;flex:none;color:var(--ink)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 10px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--sea);color:#fff;border-color:var(--sea)}
.chip.sunny{background:var(--sun);border-color:var(--sun);color:var(--sea-deep);font-weight:700}

.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--coral-soft);color:#b8452a}
.stars{color:#f0a500;font-size:13px;letter-spacing:1px}

input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--lagoon);box-shadow:0 0 0 3px rgba(111,211,208,.3)}
textarea{resize:vertical;min-height:70px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.06em}
.search{position:relative}
.search input{padding-left:40px;border-radius:16px;box-shadow:var(--shadow)}
.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%)}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
  width:min(560px,calc(100% - 20px));display:flex;gap:2px;background:rgba(11,85,99,.93);backdrop-filter:blur(12px);
  border-radius:26px;padding:6px;z-index:40;box-shadow:0 10px 30px rgba(8,50,60,.35)}
.tabbar button{flex:1;background:none;border:0;color:#cdeeed;font-size:11px;padding:7px 0;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:1px}
.tabbar .i{font-size:20px;line-height:1.2}
.tabbar button.on{background:var(--sun);color:var(--sea-deep);font-weight:700}

/* ---------- today ---------- */
.countdown{background:linear-gradient(135deg,var(--sea) 0%,var(--sea-deep) 100%);color:#fff;border:0;position:relative;overflow:hidden}
.countdown .kicker{color:#bfeeed}
.countdown .big{font-size:64px;color:var(--sun)}
.countdown::after{content:'🌴';position:absolute;right:14px;bottom:-8px;font-size:84px;opacity:.25}
.stay{border-radius:20px;padding:14px;color:#fff;border:0;text-align:left;width:100%;cursor:pointer}
.stay b{font-family:'Fraunces',serif;font-size:19px;display:block}
.stay small{opacity:.9}
.stay.carcar{background:linear-gradient(135deg,#3aa56c,#23704a)}
.stay.moalboal{background:linear-gradient(135deg,#19a4ad,#0b5f6d)}
.stay.mactan{background:linear-gradient(135deg,#ff9166,#e0593c)}
.progress{height:10px;background:var(--sand-2);border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--lagoon),var(--sea));border-radius:99px;transition:width .3s}
.progress.warn>div{background:linear-gradient(90deg,var(--sun),var(--coral))}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 4px;font-size:12px;font-weight:700;color:var(--sea-deep);display:flex;flex-direction:column;align-items:center;gap:4px}
.qa .e{font-size:22px}
.checkrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line);cursor:pointer}
.checkrow:last-child{border-bottom:0}
.checkrow .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--lagoon);display:grid;place-items:center;flex:none;font-size:13px;color:#fff}
.checkrow.on .box{background:var(--sea);border-color:var(--sea)}
.checkrow.on .t{text-decoration:line-through;color:var(--muted)}
.checkrow .t{flex:1}
.weather{background:linear-gradient(135deg,#eaf6ff,#e3f7f5);border-color:#cfe8ea}

/* ---------- days ---------- */
.day-card{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;cursor:pointer;padding:12px}
.datebox{border-radius:16px;text-align:center;color:#fff;padding:8px 0;line-height:1.1}
.datebox .dow{font-size:11px;font-weight:700;text-transform:uppercase;opacity:.9}
.datebox .dnum{font-family:'Fraunces',serif;font-size:26px;font-weight:800;display:block}
.datebox .mon{font-size:11px;text-transform:uppercase;opacity:.9}
.carcar .datebox,.bg-carcar{background:var(--palm)}
.moalboal .datebox,.bg-moalboal{background:var(--sea)}
.mactan .datebox,.bg-mactan{background:var(--coral)}
.day-card h3{font-size:17px;margin:2px 0}
.day-card p{margin:2px 0 0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.day-card .meta{font-size:12px;color:var(--muted);margin-top:5px}
.day-card.today{outline:3px solid var(--sun)}
.day-card.done{opacity:.72}
.tick{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:16px;color:transparent;display:grid;place-items:center}
.tick.on{background:var(--palm);border-color:var(--palm);color:#fff}
.flex-tag{display:inline-block;background:var(--sun);color:var(--sea-deep);font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle}
.blocks{border-left:3px solid var(--lagoon);margin-left:6px;padding-left:14px}
.block{position:relative;padding:6px 0}
.block::before{content:'';position:absolute;left:-21px;top:12px;width:11px;height:11px;border-radius:50%;background:var(--sun);border:2px solid #fff;box-shadow:0 0 0 1px var(--lagoon)}
.block .tm{font-size:12px;font-weight:700;color:var(--sea);text-transform:uppercase;letter-spacing:.04em}

/* ---------- places ---------- */
.place{overflow:hidden;padding:0;cursor:pointer;display:flex;flex-direction:column}
.place .ph{height:96px;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,var(--foam),#fdf0d8);background-size:cover;background-position:center;position:relative}
.place .ph .area{position:absolute;left:10px;bottom:8px;background:rgba(255,255,255,.9);color:var(--sea-deep);font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.place .ph .flags{position:absolute;right:10px;top:8px;font-size:16px}
.place .pb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.place h3{font-size:16px}
.place .tip{font-size:13px;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.pactions .chip{padding:6px 10px;font-size:12px}

/* ---------- photos ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.pgrid .ph{aspect-ratio:1;border-radius:14px;background:var(--sand-2) center/cover no-repeat;cursor:pointer;border:0;position:relative;overflow:hidden}
.pgrid .ph span{position:absolute;left:0;right:0;bottom:0;font-size:11px;color:#fff;padding:14px 6px 5px;background:linear-gradient(transparent,rgba(0,0,0,.55));text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgrid .add{display:grid;place-items:center;background:var(--foam);border:2px dashed var(--lagoon);color:var(--sea);font-weight:700;font-size:13px}
.lightbox img{width:100%;max-height:62vh;object-fit:contain;border-radius:16px;background:#0b2f36}

/* ---------- lists ---------- */
.lrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.lrow:last-child{border-bottom:0}
.lmain{flex:1;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.lmain b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmain small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lic{width:38px;height:38px;border-radius:12px;background:var(--foam);display:grid;place-items:center;font-size:18px;flex:none}
.bar{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.bar .progress{height:8px}
.bar b{text-align:right}
.guide h3{margin:4px 0 6px;color:var(--sea-deep)}
.guide ul{margin:6px 0 0;padding-left:20px}
.guide li{margin:3px 0}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(8,40,48,.5);animation:fade .2s}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--sand);
  border-radius:26px 26px 0 0;padding:10px 16px calc(28px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 10px}
.sheet-x{position:sticky;top:0;float:right;z-index:3}
@media(min-width:760px){.panel{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(700px,92vw);border-radius:26px;max-height:88vh;animation:fade .2s}.grab{display:none}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-hero{border-radius:20px;padding:16px;color:#fff;margin-bottom:12px}
.sheet-hero .kicker{color:rgba(255,255,255,.85)}
.title-in{background:transparent;border:0;color:#fff;font-family:'Fraunces',serif;font-size:26px;font-weight:800;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.5);border-radius:0}
.title-in:focus{box-shadow:none;border-color:#fff}
.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.planb{background:#eef7ff;border-color:#cfe3f3}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--sea-deep);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>

/* ---------------- seed data ---------------- */
function seed(){

    blocks: blocks.map(([t,txt])=>({t,x:txt})), planB:'', flex:false, done:false, notes:'', ...x });

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());
const toDate = s => new Date(s + 'T00:00:00');
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = s => { if(!s) return ''; const d = toDate(s); return `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`; };
const daysBetween = (a,b) => Math.round((toDate(b) - toDate(a)) / 864e5);
const peso = n => '₱' + Number(n||0).toLocaleString('en-PH',{maximumFractionDigits:2});
const sum = arr => arr.reduce((a,x)=>a + (Number(x.amount)||0), 0);
const baseCls = b => (b||'').startsWith('Carcar') ? 'carcar' : b === 'Moalboal' ? 'moalboal' : 'mactan';
const mapUrl = p => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.name + ', ' + (p.addr || (p.area + ', Cebu, Philippines')));
const telHref = ph => 'tel:' + String(ph).replace(/[^+\d]/g,'');
const host = u => { try { return new URL(u).hostname.replace(/^www\./,''); } catch { return u; } };
const stars = n => n ? '<span class="stars">' + '★'.repeat(n) + '</span>' : '';
const photoSrc = p => p.src || p._url || '';
const dayById = id => S.days.find(d=>d.id===id);
const placeById = id => S.places.find(p=>p.id===id);
const dayOfToday = () => S.days.find(d=>d.date===todayISO());
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }

/* ---------------- state + storage ---------------- */
let S = emptyState();
function emptyState(){ const o={}; KINDS.forEach(k=>o[k]=[]); return o; }
function sortState(){
  S.days.sort((a,b)=>a.date.localeCompare(b.date));
  S.places.sort((a,b)=>(a.o??999)-(b.o??999) || (a.ts||0)-(b.ts||0));
  S.photos.sort((a,b)=>(a.ts||0)-(b.ts||0));
  S.bucket.sort((a,b)=>(a.o??999)-(b.o??999));
  S.packing.sort((a,b)=>(a.o??999)-(b.o??999));
}
function saveLocal(){
  try { localStorage.setItem(LS, JSON.stringify(S, (k,v)=> k==='_url' ? undefined : v)); return true; }
  catch(e){ toast('Device storage is full — connect Supabase or export a backup.'); return false; }
}
function loadLocal(){
  let data = null;
  try { data = JSON.parse(localStorage.getItem(LS) || 'null'); } catch {}
  S = data || seed();
  KINDS.forEach(k=>{ if(!Array.isArray(S[k])) S[k]=[]; });
  sortState();
}
const getMeta = () => { let m = S.meta.find(x=>x.id==='meta'); if(!m){ m={id:'meta',budget:0}; S.meta.push(m); } return m; };
const clean = o => { const c={...o}; delete c._url; delete c.src; return c; };

const store = {
  sb:null, user:null, pending:{}, busy:false, lastPull:0,
  async init(){
    try { this.pending = JSON.parse(localStorage.getItem(LS_PENDING)||'{}'); } catch { this.pending={}; }
    if(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase){
      this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
      const { data:{ session } } = await this.sb.auth.getSession();
      this.user = session?.user ?? null;
      this.sb.auth.onAuthStateChange((_e, s) => {
        const was = this.user?.id; this.user = s?.user ?? null;
        if(this.user && this.user.id !== was) this.pull();
        if(!this.user) this.setStatus('Sign in to sync');
        renderMain();
      });
      if(this.user) await this.pull(); else this.setStatus('Sign in to sync');
    } else {
      this.setStatus('Saved on this device');
    }
  },
  setStatus(t, ok){ $('#syncText').textContent=t; $('#syncPill').classList.toggle('ok', !!ok); },
  savePending(){ try{ localStorage.setItem(LS_PENDING, JSON.stringify(this.pending)); }catch{} },
  put(kind, obj){
    const arr = S[kind]; const i = arr.findIndex(x=>x.id===obj.id);
    if(i>=0) arr[i]=obj; else arr.push(obj);
    saveLocal();
    if(this.sb){ this.pending[obj.id]={kind}; this.savePending(); this.flushSoon(); }
  },
  del(kind, id){
    const o = S[kind].find(x=>x.id===id);
    S[kind] = S[kind].filter(x=>x.id!==id);
    saveLocal();
    if(this.sb){
      if(kind==='photos' && o?.path && this.user) this.sb.storage.from(CONFIG.BUCKET).remove([o.path]).catch(()=>{});
      this.pending[id]={kind,del:true}; this.savePending(); this.flushSoon();
    }
  },
  flushSoon(){ clearTimeout(this._ft); this._ft = setTimeout(()=>this.flush(), 700); },
  async flush(){
    if(!this.sb || !this.user || this.busy) return;
    this.busy = true;
    try {
      // upload photos that only exist locally
      for(const p of S.photos){
        if(p.src && !p.path){
          const blob = await (await fetch(p.src)).blob();
          const path = `${this.user.id}/${p.id}.jpg`;
          const { error } = await this.sb.storage.from(CONFIG.BUCKET).upload(path, blob, {contentType:'image/jpeg', upsert:true});
          if(error) throw error;
          p.path = path; p._url = p.src; delete p.src;
          this.pending[p.id] = {kind:'photos'};
        }
      }
      const ids = Object.keys(this.pending);
      if(ids.length){
        this.setStatus('Syncing…');
        const ups=[], dels=[];
        ids.forEach(id=>{ const q=this.pending[id]; if(q.del) dels.push(id); else { const o=S[q.kind]?.find(x=>x.id===id); if(o) ups.push({user_id:this.user.id, id, kind:q.kind, data:clean(o)}); } });
        for(let i=0;i<ups.length;i+=200){
          const { error } = await this.sb.from('trip_data').upsert(ups.slice(i,i+200), {onConflict:'user_id,id'});
          if(error) throw error;
        }
        if(dels.length){ const { error } = await this.sb.from('trip_data').delete().in('id', dels); if(error) throw error; }
        ids.forEach(id=>delete this.pending[id]);
        this.savePending(); saveLocal();
      }
      this.setStatus('Synced ☁️', true);
    } catch(e){
      console.warn(e); this.savePending(); saveLocal();
      this.setStatus(navigator.onLine ? 'Sync error — will retry' : 'Offline — saved on phone');
    } finally { this.busy = false; }
  },
  async pull(){
    if(!this.sb || !this.user) return;
    this.lastPull = Date.now();
    await this.flush();
    this.setStatus('Syncing…');
    const { data, error } = await this.sb.from('trip_data').select('id,kind,data');
    if(error){ console.warn(error); this.setStatus(navigator.onLine ? 'Sync error' : 'Offline — saved on phone'); return; }
    if(!data.length){
      // first time: push everything on this device up
      KINDS.forEach(k=>S[k].forEach(o=>this.pending[o.id]={kind:k}));
      this.savePending(); await this.flush();
    } else {
      const local = Object.fromEntries(S.photos.map(p=>[p.id,p]));
      const fresh = emptyState();
      data.forEach(r=>{ if(fresh[r.kind]) fresh[r.kind].push(r.data); });
      Object.entries(this.pending).forEach(([id,q])=>{
        if(!fresh[q.kind]) return;
        fresh[q.kind] = fresh[q.kind].filter(x=>x.id!==id);
        if(!q.del){ const o=S[q.kind]?.find(x=>x.id===id); if(o) fresh[q.kind].push(o); }
      });
      fresh.photos.forEach(p=>{ const lp=local[p.id]; if(lp){ if(lp.src && !p.path) p.src=lp.src; if(lp._url) p._url=lp._url; } });
      S = fresh; sortState();
    }
    await this.refreshPhotoUrls();
    saveLocal();
    this.setStatus('Synced ☁️', true);
    renderMain(); refreshSheet();
  },
  async refreshPhotoUrls(){
    const ps = S.photos.filter(p=>p.path && !p.src);
    if(!ps.length) return;
    const { data } = await this.sb.storage.from(CONFIG.BUCKET).createSignedUrls(ps.map(p=>p.path), 60*60*24*7);
    const byPath = {}; (data||[]).forEach(r=>{ if(r.signedUrl) byPath[r.path]=r.signedUrl; });
    ps.forEach(p=>{ if(byPath[p.path]) p._url = byPath[p.path]; });
  }
};

/* ---------------- photos ---------------- */
async function compress(file, max, q){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const s = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}
async function handleFiles(files){
  const list = [...(files||[])]; if(!list.length) return;
  const ctx = {...photoCtx};
  toast(`Adding ${list.length} photo${list.length>1?'s':''}…`);
  const cloud = !!store.user;
  let added = 0;
  for(const f of list){
    try {
      const src = await compress(f, cloud?1800:1100, cloud?.82:.7);
      const dayId = ctx.day || (ctx.place ? '' : (dayOfToday()?.id || ''));
      store.put('photos', {id:uid('ph'), src, caption:'', dayId, placeId:ctx.place||'', ts:Date.now()+added});
      added++;
    } catch(e){ console.warn(e); toast('Could not read one of the photos'); }
  }
  toast(`${added} photo${added===1?'':'s'} added${cloud?' — uploading…':''}`);
  renderMain(); refreshSheet();
}

    if(!email||!password) return toast('Enter email and password');
    const { error } = await store.sb.auth.signInWithPassword({email,password});
    toast(error ? error.message : 'Signed in — syncing…'); },
  signOut: async () => { await store.sb.auth.signOut(); toast('Signed out. Data stays on this device.'); renderMain(); },
  syncNow: async () => { await store.pull(); toast('Synced'); renderMain(); },
  exportJSON: () => { const blob=new Blob([JSON.stringify(S,(k,v)=>k==='_url'?undefined:v,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`cebu-trip-backup-${todayISO()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); },
  importJSON: () => { const f=$('#importPick'); f.value=''; f.click(); }
};

async function importJSON(file){
  if(!file) return;
  try {
    const data = JSON.parse(await file.text());
    if(!data.days || !data.places) throw new Error('Not a trip backup');
    if(!confirm('Replace the data on this device with this backup?')) return;
    S = emptyState(); KINDS.forEach(k=>S[k]=Array.isArray(data[k])?data[k]:[]); sortState(); saveLocal();
    if(store.user){ KINDS.forEach(k=>S[k].forEach(o=>store.pending[o.id]={kind:k})); store.savePending(); await store.flush(); }
    toast('Backup restored'); renderAll();
  } catch(e){ toast('Could not import: ' + e.message); }
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  if(e.target.closest('a[href]')) return;              // real links just open
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = ACT[el.dataset.act]; if(!fn) return;
  e.preventDefault(); fn(el);
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.id==='filePick') return handleFiles(el.files);
  if(el.id==='importPick') return importJSON(el.files[0]);
  if(el.id==='photoDaySel'){ photoDay = el.value; return renderMain(); }
  const { kind, id, field } = el.dataset; if(!kind || !field) return;
  const o = kind==='meta' ? getMeta() : S[kind]?.find(x=>x.id===id); if(!o) return;
  o[field] = el.type==='number' ? (parseFloat(el.value)||0) : el.value;
  store.put(kind, o); renderMain();
});
document.addEventListener('input', e => {
  if(e.target.id==='placeQ'){ placeQ = e.target.value; $('#placeList').innerHTML = placesList(); }
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && $('#sheet').classList.contains('open')) closeSheet(); });

/* ---------------- start ---------------- */
loadLocal();
renderAll();
store.init().then(()=>renderMain());
</script>
</body>
</html>
